packages:
  darwin:
    brews:
      # --- Core ---
      - 'git'         # version control
      - 'gh'          # GitHub CLI
      - 'mise'        # runtime version manager (node, python, ...)

      # --- Shell & terminal ---
      - 'starship'    # cross-shell prompt
      - 'tmux'        # terminal multiplexer
      - 'herdr'       # agent multiplexer for coding agents
      - 'fzf'         # fuzzy finder (Ctrl-R history, Ctrl-T files)
      - 'zoxide'      # smarter cd: `z <dir>`
      - 'fzf-tab'                  # Tab completion menu in fzf
      - 'zsh-autosuggestions'      # grey history suggestions (→ accepts)
      - 'zsh-syntax-highlighting'  # colour commands as you type

      # --- Search & navigation (fast, .gitignore-aware) ---
      - 'ripgrep'     # rg: fast grep
      - 'fd'          # fast find
      - 'ast-grep'    # structural code search/rewrite
      - 'eza'         # modern ls (git status, tree)
      - 'bat'         # cat with syntax highlighting

      # --- Data & text ---
      - 'jq'          # JSON processor
      - 'yq'          # YAML/TOML/XML processor
      - 'sd'          # simpler find-and-replace than sed

      # --- Git & code quality ---
      - 'git-delta'   # syntax-highlighted git diffs
      - 'shellcheck'  # shell script linter

      # --- Dev utilities ---
      - 'uv'          # fast Python package/project manager
      - 'just'        # project command runner
      - 'hyperfine'   # command benchmarking
      - 'tokei'       # count lines of code
      - 'dust'        # disk usage viewer

    casks:
      # --- Editors & terminals ---
      - 'visual-studio-code'
      - 'zed'
      - 'ghostty'
      - 'font-jetbrains-mono-nerd-font'

      # --- Apps ---
      - 'claude'          # Claude desktop app
      - 'google-chrome'
      - 'obsidian'
      - 'telegram'

  # Extra packages per machine profile (on top of the lists above)
  profiles:
    personal:            # MacBook Pro
      casks:
        - 'adobe-creative-cloud'  # Creative Cloud app; install Photoshop etc. from inside it
    home:                # Mac mini
      taps:
        - 'openhue/cli'
      brews:
        - 'openhue/cli/openhue-cli'  # Philips Hue control
      casks:
        - 'tailscale-app'  # private network, Standalone app (not allowed on work machines)
    work: {}             # work Mac laptop: common packages only
